    <!-- Script Data and Application Logic -->

        // Menu Data Structure from User Prompt

                items: [

                ]
            },
            {

                icon: "fa-fire-burner",
                items: [
                    { id: 48, name: "دجاجه كامله", price: 650 },
                    { id: 49, name: "دجاج شيش", price: 600 },
                    { id: 50, name: "نص كفته ضاني", price: 480 },
                    { id: 51, name: "نص كفته كندوز", price: 410 },
                    { id: 52, name: "نص كفته بلدي", price: 450 },
                    { id: 53, name: "نص شيش", price: 320 },
                    { id: 54, name: "نص بانيه", price: 350 },
                    { id: 55, name: "نص كفته وطرب", price: 500 },
                    { id: 56, name: "نص ميكس فحم", price: 650 },
                    { id: 57, name: "نص ميكس جريل", price: 500 }
                ]
            },
            {
                category: "حواوشي كبير ع الفحم",
                icon: "fa-burger",
                items: [
                    { id: 58, name: "حواوشي كبير ع الفحم", price: 120 },
                    { id: 59, name: "حواوشي متزريلا كبير ع الفحم", price: 140 },
                    { id: 60, name: "حواوشي ميكس جبن كبير ع الفحم", price: 160 },
                    { id: 61, name: "حواوشي بسطرمه كبير ع الفحم", price: 170 },
                    { id: 62, name: "حواوشي سجق كبير ع الفحم", price: 170 },
                    { id: 63, name: "حواوشي طرب كبير ع الفحم", price: 190 }
                ]
            }
        ];

        // Cart State
        let cart = {};

        // Target WhatsApp Number
        const whatsappNumber = "201121126633"; // Egyptian format without +

        // Initialize App
        window.onload = function() {
            renderTabs();
            renderMenu(menuData);
        };

        // Render Tabs
        function renderTabs() {
            const tabsContainer = document.getElementById('categories-tabs');
            let html = `<button onclick="scrollToCategory('all')" class="category-tab bg-amber-500 text-black px-4 py-2 rounded-xl text-xs font-bold border border-amber-500 transition-all">الكل</button>`;
            
            menuData.forEach((cat, index) => {
                html += `
                    <button onclick="scrollToCategory('cat-${index}')" class="category-tab bg-zinc-900 text-gray-300 hover:text-amber-400 px-4 py-2 rounded-xl text-xs font-bold border border-zinc-800 transition-all flex items-center gap-2">
                        <i class="fa-solid ${cat.icon} text-amber-500"></i>
                        <span>${cat.category}</span>
                    </button>
                `;
            });
            tabsContainer.innerHTML = html;
        }

        // Render Menu Items
        function renderMenu(data) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            data.forEach((cat, catIndex) => {
                if (cat.items.length === 0) return;

                const section = document.createElement('section');
                section.id = `cat-${catIndex}`;
                section.className = "scroll-mt-36";

                let itemsHtml = '';
                cat.items.forEach(item => {
                    const qty = cart[item.id] ? cart[item.id].qty : 0;
                    itemsHtml += `
                        <div class="glass-card rounded-2xl p-4 flex justify-between items-center gap-3 hover:border-amber-500/50 transition-all shadow-md">
                            <div class="flex-1">
                                <h3 class="font-bold text-gray-100 text-base mb-1">${item.name}</h3>
                                <p class="text-amber-400 font-extrabold text-lg">${item.price} <span class="text-xs font-normal text-gray-400">ج.م</span></p>
                            </div>
                            
                            <div class="flex items-center gap-2 bg-zinc-900/90 p-1 rounded-xl border border-zinc-800">
                                <button onclick="updateQty(${item.id}, '${item.name}', ${item.price}, -1)" class="w-8 h-8 rounded-lg bg-zinc-800 text-amber-400 hover:bg-amber-500 hover:text-black font-bold flex items-center justify-center transition-all">
                                    <i class="fa-solid fa-minus text-xs"></i>
                                </button>
                                <span id="qty-${item.id}" class="w-6 text-center font-bold text-sm text-white">${qty}</span>
                                <button onclick="updateQty(${item.id}, '${item.name}', ${item.price}, 1)" class="w-8 h-8 rounded-lg bg-amber-500 text-black font-bold flex items-center justify-center hover:bg-amber-400 transition-all shadow-md">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                section.innerHTML = `
                    <div class="flex items-center gap-3 mb-4 pb-2 border-b border-amber-500/30">
                        <i class="fa-solid ${cat.icon} text-amber-500 text-xl"></i>
                        <h2 class="text-xl font-black text-amber-400 tracking-wide">${cat.category}</h2>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${itemsHtml}
                    </div>
                `;

                container.appendChild(section);
            });
        }

        // Filter menu items on search
        function filterItems() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            if (!query) {
                renderMenu(menuData);
                return;
            }

            const filtered = menuData.map(cat => {
                return {
                    ...cat,
                    items: cat.items.filter(item => item.name.toLowerCase().includes(query))
                };
            }).filter(cat => cat.items.length > 0);

            renderMenu(filtered);
        }

        // Scroll smooth to Category
        function scrollToCategory(id) {
            if (id === 'all') {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }
            const el = document.getElementById(id);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Cart Logic
        function updateQty(id, name, price, change) {
            if (!cart[id]) {
                if (change > 0) {
                    cart[id] = { id, name, price, qty: 1 };
                }
            } else {
                cart[id].qty += change;
                if (cart[id].qty <= 0) {
                    delete cart[id];
                }
            }

            // Update DOM item quantity
            const qtyEl = document.getElementById(`qty-${id}`);
            if (qtyEl) {
                qtyEl.innerText = cart[id] ? cart[id].qty : 0;
            }

            updateCartUI();
        }

        function updateCartUI() {
            let totalItems = 0;
            let totalPrice = 0;

            Object.values(cart).forEach(item => {
                totalItems += item.qty;
                totalPrice += item.price * item.qty;
            });

            document.getElementById('cart-badge').innerText = totalItems;
            document.getElementById('cart-total-price').innerText = totalPrice;

            const floatingBar = document.getElementById('floating-cart-bar');
            if (totalItems > 0) {
                floatingBar.classList.remove('translate-y-full');
            } else {
                floatingBar.classList.add('translate-y-full');
                closeCheckoutModal();
            }
        }

        // Checkout Modal Functions
        function openCheckoutModal() {
            if (Object.keys(cart).length === 0) return;

            const modalCartItems = document.getElementById('modal-cart-items');
            modalCartItems.innerHTML = '';
            let total = 0;

            Object.values(cart).forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                modalCartItems.innerHTML += `
                    <div class="flex justify-between items-center text-xs text-gray-300 py-1">
                        <span>${item.name} (x${item.qty})</span>
                        <span class="font-bold text-amber-400">${subtotal} ج.م</span>
                    </div>
                `;
            });

            document.getElementById('modal-cart-total').innerText = total;
            document.getElementById('checkout-modal').classList.remove('hidden');
            document.getElementById('checkout-modal').classList.add('flex');
        }

        function openCartModal() {
            openCheckoutModal();
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
            document.getElementById('checkout-modal').classList.remove('flex');
        }

        // WhatsApp Order Submission
        function sendWhatsAppOrder(e) {
            e.preventDefault();

            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();
            const notes = document.getElementById('customer-notes').value.trim();

            if (!name || !phone || !address) {
                alert("يرجى ملء جميع البيانات المطلوبة");
                return;
            }

            let text = `*طلب جديد من مطعم ع الفحم 🔥*\n\n`;
            text += `👤 *الاسم:* ${name}\n`;
            text += `📞 *الرقم:* ${phone}\n`;
            text += `📍 *العنوان:* ${address}\n`;
            if (notes) {
                text += `📝 *ملاحظات:* ${notes}\n`;
            }

            text += `\n*تفاصيل الطلب:*\n`;
            text += `--------------------------\n`;

            let totalPrice = 0;
            Object.values(cart).forEach((item, idx) => {
                const subtotal = item.price * item.qty;
                totalPrice += subtotal;
                text += `${idx + 1}. ${item.name}\n   العدد: ${item.qty} × ${item.price} ج.م = ${subtotal} ج.م\n`;
            });

            text += `--------------------------\n`;
            text += `💰 *الإجمالي الكلي:* ${totalPrice} جنيه مصري\n\n`;
            text += `شكراً لاختياركم مطعم ع الفحم! ❤️`;

            const encodedText = encodeURIComponent(text);
            const waUrl = `https://wa.me/${whatsappNumber}?text=${encodedText}`;

            window.open(waUrl, '_blank');
        }
    </script>
</body>
