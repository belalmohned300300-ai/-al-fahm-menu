    ];

    let menuItems = JSON.parse(localStorage.getItem('alfahm_menu')) || defaultMenu;
    let promoCodes = JSON.parse(localStorage.getItem('alfahm_promos')) || { 'OFF10': 10, 'WELCOME': 15 };
    let adminPass = localStorage.getItem('alfahm_pass') || '1234';

    let cart = {};
    let activeCategory = defaultCategories[0];
    let appliedDiscount = 0;
    let secretClicks = 0;

    // Initialize App
    function initApp() {
      renderCategories();
      renderMenuItems();
      renderAdminCategoryOptions();
    }

    // Render Categories
    function renderCategories() {
      const tabs = document.getElementById('categoryTabs');
      tabs.innerHTML = defaultCategories.map(cat => `
        <button onclick="selectCategory('${cat}')" class="px-4 py-2 rounded-xl whitespace-nowrap transition border ${activeCategory === cat ? 'bg-amber-600 border-amber-500 text-white' : 'bg-neutral-900 border-neutral-800 text-neutral-400 hover:text-white'}">
          ${cat}
        </button>
      `).join('');
    }

    function selectCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderMenuItems();
    }

    // Render Menu Items
    function renderMenuItems() {
      const container = document.getElementById('menuContainer');
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

      let filtered = menuItems.filter(item => {
        const matchesCat = searchVal ? true : item.cat === activeCategory;
        const matchesSearch = item.name.toLowerCase().includes(searchVal);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center text-neutral-500 py-8">لا توجد نتائج متطابقة</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const qty = cart[item.id] || 0;
        const isOutOfStock = !item.available;

        return `
          <div class="bg-neutral-900 border border-neutral-800/80 rounded-2xl p-4 flex justify-between items-center ${isOutOfStock ? 'opacity-50' : ''}">
            <div class="space-y-1">
              <div class="font-bold text-white text-base flex items-center gap-2">
                ${item.name}
                ${isOutOfStock ? '<span class="text-xs bg-red-950 text-red-500 px-2 py-0.5 rounded border border-red-800">غير متوفر</span>' : ''}
              </div>
              <div class="text-amber-500 font-extrabold text-sm">${item.price} ج.م</div>
            </div>

            ${isOutOfStock ? '' : `
              <div class="flex items-center gap-3 bg-black border border-neutral-800 rounded-xl p-1">
                ${qty > 0 ? `
                  <button onclick="updateQty(${item.id}, -1)" class="w-8 h-8 rounded-lg bg-neutral-800 text-amber-500 font-bold flex items-center justify-center hover:bg-neutral-700">-</button>
                  <span class="font-bold text-sm text-white px-1">${qty}</span>
                ` : ''}
                <button onclick="updateQty(${item.id}, 1)" class="w-8 h-8 rounded-lg bg-amber-600 text-white font-bold flex items-center justify-center hover:bg-amber-500">+</button>
              </div>
            `}
          </div>
        `;
      }).join('');
    }

    function filterMenu() {
      renderMenuItems();
    }

    // Cart Operations
    function updateQty(id, change) {
      if (!cart[id]) cart[id] = 0;
      cart[id] += change;
      if (cart[id] <= 0) delete cart[id];

      renderMenuItems();
      updateCartBar();
    }

    function updateCartBar() {
      const cartBar = document.getElementById('cartBar');
      let total = 0;
      let count = 0;

      for (let id in cart) {
        let item = menuItems.find(i => i.id == id);
        if (item) {
          total += item.price * cart[id];
          count += cart[id];
        }
      }

      document.getElementById('cartTotal').innerText = total;

      if (count > 0) {
        cartBar.classList.remove('translate-y-full');
      } else {
        cartBar.classList.add('translate-y-full');
      }
    }

    // Checkout Modal
    function openCheckoutModal() {
      const summary = document.getElementById('orderSummary');
      let subtotal = 0;

      summary.innerHTML = Object.keys(cart).map(id => {
        let item = menuItems.find(i => i.id == id);
        let itemTotal = item.price * cart[id];
        subtotal += itemTotal;
        return `
          <div class="flex justify-between items-center text-xs">
            <span class="text-white font-bold">${item.name} × ${cart[id]}</span>
            <span class="text-amber-500 font-bold">${itemTotal} ج.م</span>
          </div>
        `;
      }).join('');

      document.getElementById('subTotal').innerText = subtotal;
      appliedDiscount = 0;
      document.getElementById('discountAmount').innerText = 0;
      document.getElementById('finalTotal').innerText = subtotal;
      document.getElementById('promoMessage').innerText = '';
      document.getElementById('promoCodeInput').value = '';

      document.getElementById('checkoutModal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('checkoutModal').classList.add('hidden');
    }

    // Apply Promo Code
    function applyPromoCode() {
      const code = document.getElementById('promoCodeInput').value.trim().toUpperCase();
      const msg = document.getElementById('promoMessage');
      const subtotal = parseFloat(document.getElementById('subTotal').innerText);

      if (promoCodes[code]) {
        let percent = promoCodes[code];
        appliedDiscount = (subtotal * percent) / 100;
        let final = subtotal - appliedDiscount;

        document.getElementById('discountAmount').innerText = appliedDiscount.toFixed(1);
        document.getElementById('finalTotal').innerText = final.toFixed(1);

        msg.className = "text-xs mt-1 font-bold text-emerald-400";
        msg.innerText = `تم تطبيق خصم ${percent}% بنجاح!`;
      } else {
        msg.className = "text-xs mt-1 font-bold text-red-400";
        msg.innerText = "كود الخصم غير صحيح أو منتهي الصلاحية";
      }
    }

    // Send to WhatsApp
    function sendOrderToWhatsApp(e) {
      e.preventDefault();

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();
      const notes = document.getElementById('custNotes').value.trim();

      let subtotal = parseFloat(document.getElementById('subTotal').innerText);
      let finalTotal = parseFloat(document.getElementById('finalTotal').innerText);

      let msg = `طلب جديد من مطعم *ع الفحم* 🔥\n\n`;
      msg += `*العميل:* ${name}\n`;
      msg += `*الهاتف:* ${phone}\n`;
      msg += `*العنوان:* ${address}\n`;
      if (notes) msg += `*ملاحظات:* ${notes}\n`;
      msg += `\n*الأصناف المطلوبة:*\n`;

      for (let id in cart) {
        let item = menuItems.find(i => i.id == id);
        msg += `- ${item.name} (عدد ${cart[id]}) = ${item.price * cart[id]} ج.م\n`;
      }

      msg += `\n*المجموع الفرعي:* ${subtotal} ج.م`;
      if (appliedDiscount > 0) {
        msg += `\n*الخصم:* -${appliedDiscount.toFixed(1)} ج.م`;
      }
      msg += `\n*الإجمالي النهائي:* ${finalTotal.toFixed(1)} ج.م\n`;

      const whatsappNum = "201121126633";
      const url = `https://wa.me/${whatsappNum}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }

    // Admin Control Panel Logic
    function handleSecretClick() {
      secretClicks++;
      if (secretClicks >= 5) {
        secretClicks = 0;
        openAdminModal();
      }
    }

    function openAdminModal() {
      document.getElementById('adminAuthModal').classList.remove('hidden');
    }

    function closeAdminAuthModal() {
      document.getElementById('adminAuthModal').classList.add('hidden');
    }

    function checkAdminPassword() {
      const input = document.getElementById('adminPassInput').value;
      if (input === adminPass) {
        closeAdminAuthModal();
        openAdminPanel();
      } else {
        alert('كلمة السر غير صحيحة!');
      }
    }

    function openAdminPanel() {
      renderAdminItems();
      document.getElementById('adminPanelModal').classList.remove('hidden');
    }

    function closeAdminPanelModal() {
      document.getElementById('adminPanelModal').classList.add('hidden');
    }

    function renderAdminCategoryOptions() {
      const sel = document.getElementById('newItemCat');
      sel.innerHTML = defaultCategories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function renderAdminItems() {
      const list = document.getElementById('adminItemsList');
      list.innerHTML = menuItems.map(item => `
        <div class="flex items-center justify-between bg-black p-2 rounded-lg border border-neutral-800 text-xs gap-2">
          <span class="text-white font-bold flex-1 truncate">${item.name}</span>
          <input type="number" value="${item.price}" onchange="updateItemPrice(${item.id}, this.value)" class="w-16 bg-neutral-900 border border-neutral-700 rounded px-1.5 py-1 text-center text-amber-500 font-bold">
          <button onclick="toggleItemStock(${item.id})" class="px-2 py-1 rounded font-bold ${item.available ? 'bg-emerald-900 text-emerald-400 border border-emerald-700' : 'bg-red-900 text-red-400 border border-red-700'}">
            ${item.available ? 'متاح' : 'مغلق'}
          </button>
        </div>
      `).join('');
    }

    function updateItemPrice(id, newPrice) {
      let item = menuItems.find(i => i.id == id);
      if (item) {
        item.price = parseFloat(newPrice) || item.price;
        saveAndSync();
      }
    }

    function toggleItemStock(id) {
      let item = menuItems.find(i => i.id == id);
      if (item) {
        item.available = !item.available;
        saveAndSync();
        renderAdminItems();
      }
    }

    function addNewMenuItem() {
      const name = document.getElementById('newItemName').value.trim();
      const price = parseFloat(document.getElementById('newItemPrice').value);
      const cat = document.getElementById('newItemCat').value;

      if (name && price) {
        const newItem = {
          id: Date.now(),
          name: name,
          price: price,
          cat: cat,
          available: true
        };
        menuItems.push(newItem);
        saveAndSync();
        renderAdminItems();
        document.getElementById('newItemName').value = '';
        document.getElementById('newItemPrice').value = '';
        alert('تمت إضافة الصنف بنجاح!');
      } else {
        alert('برجاء كتابة الاسم والسعر!');
      }
    }

    function addNewPromoCode() {
      const code = document.getElementById('newPromoCode').value.trim().toUpperCase();
      const percent = parseFloat(document.getElementById('newPromoPercent').value);

      if (code && percent) {
        promoCodes[code] = percent;
        localStorage.setItem('alfahm_promos', JSON.stringify(promoCodes));
        document.getElementById('newPromoCode').value = '';
        document.getElementById('newPromoPercent').value = '';
        alert(`تم تفعيل كود الخصم ${code} بنسبة ${percent}% بنجاح!`);
      }
    }

    function saveAndSync() {
      localStorage.setItem('alfahm_menu', JSON.stringify(menuItems));
      renderMenuItems();
    }

    // Run
    initApp();
  </script>
</body>
</html>
